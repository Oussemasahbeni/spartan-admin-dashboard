<div *transloco="let t; prefix: 'unauthorized'" class="flex h-screen items-center justify-center">
  <div class="max-w-md space-y-6 px-4 text-center">
    <div class="space-y-2">
      <h1 class="text-primary text-9xl font-bold">401</h1>
      <h2 class="text-3xl font-semibold tracking-tight">{{ t('heading') }}</h2>
      <p class="text-muted-foreground text-lg">
        {{ t('message') }}
      </p>
    </div>
    <div class="flex justify-center gap-4">
      <a hlmBtn [routerLink]="['/login']">{{ t('goToLogin') }}</a>
      <button type="button" hlmBtn variant="outline" (click)="onGoBack()">
        {{ t('goBack') }}
      </button>
    </div>
  </div>
</div>
