<adm-auth-layout>
  <div *transloco="let t; prefix: 'auth.resetPassword'" hlmCard class="mx-auto w-full max-w-xl justify-center p-4">
    <div class="space-y-2 text-center">
      <h1 class="text-2xl font-semibold tracking-tight">
        {{ t('title') }}
      </h1>
      <p class="text-muted-foreground text-center text-sm">
        {{ t('description') }}
      </p>
    </div>

    @if (showAlert()) {
      <div hlmAlert variant="success">
        <ng-icon hlm hlmAlertIcon name="lucideCircleCheck" />
        <h4 hlmAlertTitle>{{ t('alert.successTitle') }}</h4>
        <div hlmAlertDescription>
          {{ t('alert.resetLinkSent') }}
        </div>
      </div>
    }

    <form class="flex flex-col gap-4" [formRoot]="resetPasswordForm">
      <hlm-field>
        <hlm-field-label for="email">{{ t('emailLabel') }}</hlm-field-label>
        <input
          hlmInput
          id="email"
          type="email"
          autocomplete="email"
          [placeholder]="t('emailPlaceholder')"
          [formField]="resetPasswordForm.email"
        />

        @for (error of resetPasswordForm.email().errors(); track error.kind) {
          <hlm-field-error *transloco="let t">{{ t('validation.' + error.kind) }}</hlm-field-error>
        }
      </hlm-field>

      <button type="submit" hlmBtn [disabled]="resetPasswordForm().submitting()">
        @if (resetPasswordForm().submitting()) {
          <hlm-spinner />
        }
        {{ t('submitBtn') }}
      </button>
    </form>

    <div class="mt-4 text-center">
      <a
        routerLink="/login"
        class="text-primary text-sm font-medium underline-offset-4 hover:cursor-pointer hover:underline"
      >
        {{ t('backToLogin') }}
      </a>
    </div>
  </div>
</adm-auth-layout>
