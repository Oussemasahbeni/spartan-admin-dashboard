<adm-auth-layout>
  <div *transloco="let t; prefix: 'auth.signup'" hlmCard class="mx-auto w-full max-w-xl justify-center p-4">
    <div class="space-y-2 text-center">
      <h1 class="text-2xl font-semibold tracking-tight">
        {{ t('title') }}
      </h1>
      <p class="text-muted-foreground text-center text-sm">
        {{ t('haveAccount') }}
        <a routerLink="/login" class="text-primary font-semibold underline-offset-4 hover:cursor-pointer hover:underline">
          {{ t('signIn') }}
        </a>
      </p>
    </div>

    <form class="flex flex-col gap-4" [formRoot]="signupForm">
      <hlm-field>
        <hlm-field-label for="name">{{ t('nameLabel') }}</hlm-field-label>
        <input
          hlmInput
          id="name"
          type="text"
          autocomplete="name"
          [placeholder]="t('namePlaceholder')"
          [formField]="signupForm.name"
        />
        <adm-validation-errors [fieldState]="signupForm.name()" />
      </hlm-field>

      <hlm-field>
        <hlm-field-label for="email">{{ t('emailLabel') }}</hlm-field-label>
        <input
          hlmInput
          id="email"
          type="email"
          autocomplete="email"
          [placeholder]="t('emailPlaceholder')"
          [formField]="signupForm.email"
        />
        <adm-validation-errors [fieldState]="signupForm.email()" />
      </hlm-field>

      <hlm-field>
        <hlm-field-label for="password">{{ t('passwordLabel') }}</hlm-field-label>
        <!-- <div class="relative">
          <input
            hlmInput
            id="password"
            autocomplete="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            [placeholder]="t('passwordPlaceholder')"
            [formField]="signupForm.password"
          />
          <ng-icon
            hlmIcon
            size="sm"
            class="absolute inset-y-2.5 end-2 cursor-pointer"
            [name]="showPassword() ? 'lucideEye' : 'lucideEyeOff'"
            (click)="showPassword.set(!showPassword())"
          />
        </div> -->
        <hlm-input-group>
          <input
            hlmInputGroupInput
            id="password"
            autocomplete="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            [placeholder]="t('passwordPlaceholder')"
            [formField]="signupForm.password"
          />
          <hlm-input-group-addon align="inline-end">
            <ng-icon
              hlmIcon
              size="sm"
              class="cursor-pointer"
              [name]="showPassword() ? 'lucideEye' : 'lucideEyeOff'"
              (click)="showPassword.set(!showPassword())"
          /></hlm-input-group-addon>
        </hlm-input-group>

        <adm-validation-errors [fieldState]="signupForm.password()" [errorParams]="{ min: passwordMinLength }" />
      </hlm-field>

      <hlm-field>
        <hlm-field-label for="confirmPassword">{{ t('confirmPasswordLabel') }}</hlm-field-label>
        <hlm-input-group>
          <input
            hlmInputGroupInput
            id="confirmPassword"
            autocomplete="new-password"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [placeholder]="t('confirmPasswordPlaceholder')"
            [formField]="signupForm.confirmPassword"
          />
          <hlm-input-group-addon align="inline-end">
            <ng-icon
              hlmIcon
              size="sm"
              class="cursor-pointer"
              [name]="showConfirmPassword() ? 'lucideEye' : 'lucideEyeOff'"
              (click)="showConfirmPassword.set(!showConfirmPassword())"
          /></hlm-input-group-addon>
        </hlm-input-group>
        <adm-validation-errors [fieldState]="signupForm.confirmPassword()" />
      </hlm-field>

      <button type="submit" hlmBtn [disabled]="isLoading()">
        @if (isLoading()) {
          <hlm-spinner />
        }
        {{ t('signupButton') }}
      </button>
    </form>

    <p class="text-muted-foreground text-center text-sm sm:px-8">
      {{ t('termsText') }}
      <a class="hover:text-primary cursor-pointer underline underline-offset-4">{{ t('termsOfService') }}</a>
      {{ t('and') }}
      <a class="hover:text-primary cursor-pointer underline underline-offset-4">{{ t('privacyPolicy') }}</a>
      .
    </p>
  </div>
</adm-auth-layout>
