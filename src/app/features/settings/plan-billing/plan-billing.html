<div *transloco="let t; prefix: 'settings.planBilling'" class="w-full max-w-5xl">
  <!-- Form -->
  <form (submit)="onSubmit($event)">
    <div class="grid w-full gap-6 sm:grid-cols-3">
      <!-- Plan Alert -->
      <div class="sm:col-span-3">
        <div hlmAlert variant="default">
          <ng-icon hlm hlmAlertIcon name="lucideInfo" />
          <p hlmAlertDesc>
            {{ t('planAlert') }}
          </p>
        </div>
      </div>

      <!-- Plans -->
      <hlm-radio-group class="col-span-full grid grid-cols-1 gap-4 sm:grid-cols-3" [formField]="planBillingForm.plan">
        @for (plan of plans(); track plan.value) {
          <label hlmLabel [class]="cardClass" [for]="plan.value">
            <hlm-radio class="sr-only" [value]="plan.value" [id]="plan.value">
              <hlm-radio-indicator />
            </hlm-radio>
            <ng-icon hlm name="lucideCreditCard" class="mb-3" />
            <div class="font-semibold">{{ t('plans.' + plan.value + '.label') }}</div>
            <p class="text-muted-foreground mt-1 text-center text-sm">
              {{ t('plans.' + plan.value + '.details') }}
            </p>
            <div class="mt-4 text-lg font-semibold">
              <span>{{ plan.price | currency: 'USD' : 'symbol' : '1.0' }}</span>
              <span class="text-muted-foreground text-sm font-normal"> {{ t('perMonth') }}</span>
            </div>
          </label>
        }
      </hlm-radio-group>
    </div>

    <!-- Divider -->
    <hlm-separator class="my-10" />

    <!-- Payment Details Section -->
    <div class="w-full">
      <h2 class="text-xl font-semibold">{{ t('paymentDetails.title') }}</h2>
      <p class="text-muted-foreground text-sm">
        {{ t('paymentDetails.description') }}
      </p>
    </div>

    <div class="mt-8 grid w-full grid-cols-4 gap-6">
      <!-- Card Holder -->
      <div class="col-span-4">
        <hlm-field>
          <hlm-field-label for="cardHolder">{{ t('cardHolder') }}</hlm-field-label>
          <hlm-input-group>
            <hlm-input-group-addon>
              <ng-icon name="lucideUser" />
            </hlm-input-group-addon>
            <input hlmInputGroupInput id="cardHolder" type="text" [formField]="planBillingForm.cardHolder" />
          </hlm-input-group>
          <adm-validation-errors [fieldState]="planBillingForm.cardHolder()" />
        </hlm-field>
      </div>

      <!-- Card Number -->
      <div class="col-span-4 sm:col-span-2">
        <hlm-field>
          <hlm-field-label for="cardNumber">{{ t('cardNumber') }}</hlm-field-label>
          <hlm-input-group>
            <hlm-input-group-addon>
              <ng-icon name="lucideCreditCard" />
            </hlm-input-group-addon>
            <input hlmInputGroupInput id="cardNumber" type="text" [formField]="planBillingForm.cardNumber" />
          </hlm-input-group>
          <adm-validation-errors [fieldState]="planBillingForm.cardNumber()" />
        </hlm-field>
      </div>

      <!-- Card Expiration -->
      <div class="col-span-2 sm:col-span-1">
        <hlm-field>
          <hlm-field-label for="cardExpiration">{{ t('expirationDate') }}</hlm-field-label>
          <hlm-input-group>
            <hlm-input-group-addon>
              <ng-icon name="lucideCalendar" />
            </hlm-input-group-addon>
            <input
              hlmInputGroupInput
              id="cardExpiration"
              type="text"
              [placeholder]="t('expirationPlaceholder')"
              [formField]="planBillingForm.cardExpiration"
            />
          </hlm-input-group>
          <adm-validation-errors [fieldState]="planBillingForm.cardExpiration()" />
        </hlm-field>
      </div>

      <!-- Card CVC -->
      <div class="col-span-2 sm:col-span-1">
        <hlm-field>
          <hlm-field-label for="cardCVC">{{ t('cvc') }}</hlm-field-label>
          <hlm-input-group>
            <hlm-input-group-addon>
              <ng-icon name="lucideLock" />
            </hlm-input-group-addon>
            <input hlmInputGroupInput id="cardCVC" type="text" [formField]="planBillingForm.cardCVC" />
          </hlm-input-group>
          <adm-validation-errors [fieldState]="planBillingForm.cardCVC()" />
        </hlm-field>
      </div>

      <!-- Country -->
      <div class="col-span-4 sm:col-span-2">
        <hlm-field>
          <hlm-field-label for="country">{{ t('country') }}</hlm-field-label>
          <adm-country-picker [formField]="planBillingForm.country" />
        </hlm-field>
      </div>

      <!-- ZIP -->
      <div class="col-span-4 sm:col-span-2">
        <hlm-field>
          <hlm-field-label for="zip">{{ t('zipCode') }}</hlm-field-label>
          <hlm-input-group>
            <hlm-input-group-addon>
              <ng-icon name="lucideHash" />
            </hlm-input-group-addon>
            <input hlmInputGroupInput id="zip" type="text" [formField]="planBillingForm.zip" />
          </hlm-input-group>
        </hlm-field>
      </div>
    </div>

    <!-- Divider -->
    <hlm-separator class="my-5" />

    <!-- Actions -->
    <div *transloco="let t; prefix: 'buttons'" class="flex items-center justify-end gap-4">
      <button type="submit" hlmBtn [disabled]="isLoading()">
        @if (isLoading()) {
          <hlm-spinner />
        }
        {{ t('save') }}
      </button>
    </div>
  </form>
</div>
