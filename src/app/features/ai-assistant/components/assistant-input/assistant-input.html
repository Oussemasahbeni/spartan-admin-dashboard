<ng-container *transloco="let t; prefix: 'aiAssistant'">
  <div class="flex flex-col gap-3">
    <!-- Hidden file input for attachments -->
    <input
      #fileInput
      type="file"
      multiple
      accept="image/*,.pdf,.doc,.docx,.txt,.csv,.json,.xml"
      hidden
      aria-hidden="true"
      (change)="handleFileSelect($event)"
    />

    <!-- Main Input Group -->
    <div hlmInputGroup class="rounded-2xl">
      <!-- Attachments Display -->
      @if (hasAttachments()) {
        <hlm-input-group-addon align="block-start">
          <hlm-attachment-group>
            @for (file of attachments(); track file.name + file.size) {
              <hlm-attachment>
                @if (isImageFile(file)) {
                  <hlm-attachment-media variant="image">
                    <img [src]="getFilePreviewUrl(file)" [alt]="file.name" />
                  </hlm-attachment-media>
                } @else {
                  <hlm-attachment-media variant="icon">
                    <ng-icon name="lucideFile" />
                  </hlm-attachment-media>
                }
                <hlm-attachment-content>
                  <hlm-attachment-title>{{ file.name }}</hlm-attachment-title>
                  <hlm-attachment-description> {{ file.size | bytes }} </hlm-attachment-description>
                </hlm-attachment-content>
                <hlm-attachment-actions>
                  <button
                    type="button"
                    hlmAttachmentAction
                    [aria-label]="t('input.removeAttachment', { filename: file.name })"
                    (click)="removeAttachment(file)"
                  >
                    <ng-icon name="lucideX" />
                  </button>
                </hlm-attachment-actions>
              </hlm-attachment>
            }
          </hlm-attachment-group>
        </hlm-input-group-addon>
      }

      <!-- Textarea -->
      <textarea
        #textareaRef
        hlmInputGroupTextarea
        class="max-h-96"
        aria-describedby="keyboard-hint"
        [aria-label]="t('input.placeholder')"
        [placeholder]="t('input.placeholder')"
        [formField]="promptForm.prompt"
        (keydown)="handleKeydown($event)"
      ></textarea>

      <span id="keyboard-hint" class="sr-only"> {{ t('input.keyboardHint') }} </span>

      <!--  Toolbar -->
      <div hlmInputGroupAddon class="flex justify-between gap-2" [align]="'block-end'">
        <div class="flex items-center gap-1">
          <button type="button" class="rounded-full" hlmInputGroupButton size="icon-sm" [hlmDropdownMenuTrigger]="plusMenu">
            <span class="sr-only">{{ t('ariaLabels.moreOptions') }}</span>
            <ng-icon name="lucidePlus" />
          </button>

          <ng-template #plusMenu>
            <hlm-dropdown-menu class="w-64">
              <!-- Attachments -->
              <hlm-dropdown-menu-group>
                <button type="button" hlmDropdownMenuItem [aria-label]="t('input.attachFile')" (click)="triggerFileInput()">
                  <ng-icon name="lucidePaperclip" />
                  {{ t('input.addPhotosFiles') }}
                </button>
              </hlm-dropdown-menu-group>

              <hlm-dropdown-menu-separator />

              <!--  Capabilities -->
              <hlm-dropdown-menu-group>
                <!-- Web Search -->
                <button
                  type="button"
                  hlmDropdownMenuCheckbox
                  [checked]="enableWebSearch()"
                  [keepOpen]="false"
                  (click)="enableWebSearch.set(!enableWebSearch())"
                >
                  <div class="flex items-center gap-2">
                    <ng-icon name="lucideGlobe" class="text-muted-foreground" />
                    <span>{{ t('capabilities.webSearch') }}</span>
                  </div>
                  <hlm-dropdown-menu-checkbox-indicator />
                </button>
                <!-- Thinking -->
                <button
                  type="button"
                  hlmDropdownMenuCheckbox
                  [checked]="enableThinking()"
                  [keepOpen]="false"
                  (click)="enableThinking.set(!enableThinking())"
                >
                  <div class="flex items-center gap-2">
                    <ng-icon name="lucideLightbulb" class="text-muted-foreground" />
                    <span>{{ t('capabilities.thinking') }}</span>
                  </div>
                  <hlm-dropdown-menu-checkbox-indicator />
                </button>

                <!-- Deep Reasoning -->
                <button
                  type="button"
                  hlmDropdownMenuCheckbox
                  [checked]="enableReasoning()"
                  [keepOpen]="false"
                  (click)="enableReasoning.set(!enableReasoning())"
                >
                  <div class="flex items-center gap-2">
                    <ng-icon name="lucideBrainCircuit" class="text-muted-foreground" />
                    <span>{{ t('capabilities.deepReasoning') }}</span>
                  </div>
                  <hlm-dropdown-menu-checkbox-indicator />
                </button>

                <button type="button" hlmDropdownMenuItem side="right" align="start" [hlmDropdownMenuTrigger]="moreFeatures">
                  <ng-icon name="lucideMoreHorizontal" class="text-muted-foreground" />
                  <span>{{ t('capabilities.more') }}</span>
                  <hlm-dropdown-menu-item-sub-indicator />
                </button>

                <ng-template #moreFeatures>
                  <hlm-dropdown-menu-sub>
                    <button type="button" hlmDropdownMenuItem>
                      <ng-icon name="lucideAppWindow" class="text-muted-foreground" />
                      {{ t('capabilities.exploreApps') }}
                    </button>
                    <button type="button" hlmDropdownMenuItem>
                      <ng-icon name="lucideGraduationCap" class="text-muted-foreground" />
                      {{ t('capabilities.studyAndLearn') }}
                    </button>
                    <button type="button" hlmDropdownMenuItem>
                      <ng-icon name="lucidePencilRuler" class="text-muted-foreground" />
                      {{ t('capabilities.canvas') }}
                    </button>
                  </hlm-dropdown-menu-sub>
                </ng-template>
              </hlm-dropdown-menu-group>
            </hlm-dropdown-menu>
          </ng-template>
        </div>

        <div class="flex items-center gap-1">
          <!-- Model selector dropdown -->
          <button type="button" hlmBtn variant="ghost" [hlmDropdownMenuTrigger]="modelMenu">
            {{ selectedModel() }}
            <ng-icon name="lucideChevronDown" />
          </button>
          <ng-template #modelMenu>
            <hlm-dropdown-menu class="w-56">
              <hlm-dropdown-menu-group>
                @for (model of models(); track model) {
                  <button
                    type="button"
                    hlmDropdownMenuCheckbox
                    checkBoxAlign="end"
                    [checked]="selectedModel() === model"
                    [keepOpen]="false"
                    (click)="selectModel(model)"
                  >
                    <hlm-dropdown-menu-checkbox-indicator />
                    <span>{{ model }}</span>
                  </button>
                }
              </hlm-dropdown-menu-group>
            </hlm-dropdown-menu>
          </ng-template>

          <!-- Mic button -->
          <button
            type="button"
            hlmInputGroupButton
            class="rounded-full"
            size="icon-sm"
            [aria-label]="t('input.voiceInput')"
            [class.animate-pulse]="isRecording()"
            [class.text-red-500]="isRecording()"
            [aria-pressed]="isRecording()"
            (click)="toggleMic()"
          >
            <ng-icon name="lucideMic" />
          </button>

          <!-- Send button -->

          @if (isStreaming()) {
            <button
              type="button"
              hlmInputGroupButton
              class="rounded-full"
              size="icon-sm"
              [aria-label]="t('input.stopStreaming')"
              [variant]="'secondary'"
              (click)="handleStopStreaming()"
            >
              <ng-icon name="lucideSquareStop" class="text-white" />
            </button>
          } @else {
            <button
              type="button"
              hlmInputGroupButton
              class="rounded-full"
              size="icon-sm"
              [aria-label]="t('input.sendMessage')"
              [variant]="'default'"
              [disabled]="!canSend()"
              (click)="handleSend()"
            >
              <ng-icon name="lucideArrowUp" />
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</ng-container>
