<div class="mx-auto w-full max-w-4xl">
  @if (isEmpty()) {
    <div class="flex min-h-full items-center justify-center">
      <div class="mx-auto w-full max-w-3xl">
        <adm-assistant-empty-state (promptSelect)="handlePromptSelect($event)" />
      </div>
    </div>
  } @else {
    <div class="mx-auto w-full max-w-3xl">
      <!-- <adm-chat-list
        [messages]="messages()"
        [loading]="isLoading()"
        (messageCopy)="handleMessageCopy($event)"
        (messageRegenerate)="handleMessageRegenerate($event)"
      /> -->
      <adm-chat-list [loading]="isLoading()" />
    </div>
  }

  <div class="mx-auto w-full max-w-3xl">
    <adm-assistant-input
      [disabled]="isLoading()"
      [suggestions]="activeSuggestions()"
      (messageSend)="handleSendMessage($event)"
    />
  </div>
</div>
