<hlm-dialog-header *transloco="let t; prefix: 'calendar.form'">
  <h3 hlmDialogTitle>{{ isEditMode() ? t('editTitle') : t('addTitle') }}</h3>
  <p hlmDialogDescription>{{ isEditMode() ? t('editDescription') : t('addDescription') }}</p>
</hlm-dialog-header>

<div class="flex max-h-[calc(100vh-2rem)] w-full flex-col gap-0 overflow-y-auto sm:max-h-[min(640px,80vh)]">
  <form *transloco="let t; prefix: 'calendar.form'" class="flex w-full flex-col gap-4 p-2" [formRoot]="eventForm">
    <!-- Title -->
    <hlm-field>
      <hlm-field-label for="title">{{ t('label.title') }}</hlm-field-label>
      <input hlmInput id="title" [formField]="eventForm.title" />
      <adm-validation-errors [fieldState]="eventForm.title()" />
    </hlm-field>
    <!-- Description -->
    <hlm-field>
      <hlm-field-label for="description">{{ t('label.description') }}</hlm-field-label>
      <input hlmInput id="description" [formField]="eventForm.description" />
      <adm-validation-errors [fieldState]="eventForm.description()" />
    </hlm-field>
    <!-- Start Date -->
    <div class="flex gap-4">
      <hlm-field>
        <hlm-field-label for="startDate">{{ t('label.startDate') }}</hlm-field-label>
        <hlm-date-picker
          class="w-full"
          buttonId="startDate"
          captionLayout="dropdown"
          [formField]="eventForm.startDate"
          [autoCloseOnSelect]="true"
        >
          <span>{{ t('placeholder.selectDate') }}</span>
        </hlm-date-picker>
        <adm-validation-errors [fieldState]="eventForm.startDate()" />
      </hlm-field>
      <div class="flex flex-col gap-3">
        <label for="time-picker" hlmLabel class="px-1">
          {{ t('label.startTime') }}
        </label>
        <input
          hlmInput
          id="time-picker"
          type="time"
          step="1"
          class="bg-background appearance-none [&::-webkit-calendar-picker-indicator]:hidden [&::-webkit-calendar-picker-indicator]:appearance-none"
          [formField]="eventForm.startTime"
        />
      </div>
    </div>

    <!-- End Date -->
    <div class="flex gap-4">
      <hlm-field>
        <hlm-field-label for="endDate">{{ t('label.endDate') }}</hlm-field-label>
        <hlm-date-picker
          class="w-full"
          buttonId="endDate"
          captionLayout="dropdown"
          [formField]="eventForm.endDate"
          [autoCloseOnSelect]="true"
        >
          <span>{{ t('placeholder.selectDate') }}</span>
        </hlm-date-picker>
        <adm-validation-errors [fieldState]="eventForm.endDate()" />
      </hlm-field>
      <div class="flex flex-col gap-3">
        <label for="time-picker" hlmLabel class="px-1">
          {{ t('label.endTime') }}
        </label>
        <input
          hlmInput
          id="time-picker"
          type="time"
          step="1"
          class="bg-background appearance-none [&::-webkit-calendar-picker-indicator]:hidden [&::-webkit-calendar-picker-indicator]:appearance-none"
          [formField]="eventForm.endTime"
        />
      </div>
    </div>

    <hlm-dialog-footer *transloco="let t; prefix: 'buttons'">
      <button type="button" hlmBtn variant="outline" brnDialogClose>{{ t('cancel') }}</button>
      <button type="submit" hlmBtn [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <hlm-spinner />
        }
        {{ t('save') }}
      </button>
    </hlm-dialog-footer>
  </form>
</div>
